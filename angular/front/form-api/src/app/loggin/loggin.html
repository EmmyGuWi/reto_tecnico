<div class="container vh-100 d-flex justify-content-center align-items-center">

  <div class="row w-100 justify-content-center">

    <div class="col-12 col-sm-10 col-md-6 col-lg-4">

      <div class="card shadow border-0 rounded-4">

        <div class="card-body p-4 p-md-5">

          <h2 class="text-center mb-2">
            Iniciar sesión
          </h2>

          <p class="text-center text-muted mb-4">
            Ingresa tus credenciales
          </p>

          <form (ngSubmit)="login()">

            <!-- USUARIO -->
            <div class="mb-3">

              <label
                for="usuario"
                class="form-label">
                Usuario
              </label>

              <input
                id="usuario"
                type="text"
                class="form-control"
                placeholder="Nombre de usuario"
                [(ngModel)]="usuario"
                name="usuario"
                required>

            </div>

            <!-- PASSWORD -->
            <div class="mb-3">

              <label
                for="password"
                class="form-label">
                Contraseña
              </label>

              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Contraseña"
                [(ngModel)]="password"
                name="password"
                minlength="8"
                maxlength="20"
                required>

              <div class="form-text">
                Debe contener entre 8 y 20 caracteres.
              </div>

            </div>

            <!-- ERROR -->
            @if (mensajeError) {

              <div
                class="alert alert-danger py-2"
                role="alert">

                {{ mensajeError }}

              </div>

            }

            <!-- BOTÓN -->
            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="cargando">

              @if (cargando) {

                <span
                  class="spinner-border spinner-border-sm me-2">
                </span>

                Validando...

              } @else {

                Iniciar sesión

              }

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
